name: Mobile (Android APK)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag to upload the APK to (optional)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    name: Build signed Android APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL || 'https://github.com/SikamikanikoBG/patzer/releases/download/models' }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out patzer-release.apk "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify patzer-release.apk

      - name: Use unsigned APK when signing secrets are unavailable
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" patzer-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: patzer-release*.apk

      - name: Publish APK to GitHub Release
        if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release upload "$TAG" patzer-release*.apk --clobber
